spring.application.name=RopaStore

# Configuración de la base de datos MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/${DB_NAME:ropastore_db}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:ropa_user}
spring.datasource.password=${DB_PASSWORD:ropa_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8081

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
