version: '3.8'

services:
  
  ropastore-oracle:
    image: gvenzl/oracle-free:latest
    container_name: ropastore-oracle
    restart: always
    environment:
      - ORACLE_PASSWORD=ropa_password
      - APP_USER=ropa_user
      - APP_USER_PASSWORD=ropa_password  
    ports:
      - "1522:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata

  ropastore-app:
    build: .
    container_name: ropastore-app
    restart: always
    ports:
      - "8081:8081" 
    environment:
      DB_HOST: ropastore-oracle
      DB_PORT: 1521
      DB_NAME: FREEPDB1
      DB_USER: ropa_user
      DB_PASSWORD: ropa_password
    depends_on:
      - ropastore-oracle

volumes:
  oracle_data: